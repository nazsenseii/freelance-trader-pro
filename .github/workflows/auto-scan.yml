name: Bursa Auto Scanner

on:
  schedule:
    # Berjalan pada pukul 10:00 pagi UTC (6:00 petang Waktu Malaysia)
    # Setiap hari Isnin hingga Jumaat sahaja (1-5)
    - cron: '13 10 * * 1-5'
  workflow_dispatch: # Kekalkan ini untuk benarkan klik manual

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout kod projek
        uses: actions/checkout@v4
      
      - name: Pasang Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Pakej (NPM)
        run: npm install
        
      - name: Jalankan Enjin Scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scanner.mjs
